3gADMNWuyyM/uPVKPEJsJz0u7XMgIlypH/D5mFmGfPn0g6AAAAAElFTkSuQmCC">
<style>
  :root {
    --bg: #14161a;
    --bg-soft: #1b1e24;
    --bg-msg: #21252c;
    --line: #2c313a;
    --fg: #e6e8ec;
    --fg-dim: #9aa3b2;
    --fg-faint: #6b7482;
    --accent: #4f8cff;
    --danger: #ff6b6b;
    --ok: #46c98b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px 11px;
    background: transparent;          /* 不再是一整块浅色底，融入页面 */
    flex: 0 0 auto;
    position: relative;
  }
  /* 底部用一条两端淡出的细线代替原来的实边，和圆角气泡的气质一致 */
  header::after {
    content: ""; position: absolute; left: 16px; right: 16px; bottom: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--line) 18%, var(--line) 82%, transparent);
  }
  header .title { font-weight: 600; letter-spacing: .3px; }
  header button {
    padding: 5px 12px; font-size: 13px; color: var(--fg-dim);
    background: transparent; border-color: transparent;
  }
  header button:hover { background: var(--bg-msg); border-color: var(--line); color: var(--fg); }
  header .meta { color: var(--fg-faint); font-size: 12px; margin-left: auto; text-align: right; }
  header .meta b { color: var(--fg-dim); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); display: inline-block; }
  .dot.busy { background: var(--ok); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  #delegationsToggle { white-space: nowrap; }
  #delegationsToggle[aria-expanded="true"] { background: var(--bg-msg); border-color: var(--line); color: var(--fg); }
  #delegationsPanel {
    flex: 0 0 auto; margin: 0 16px 8px; padding: 10px 12px;
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px;
    max-height: 46vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2f3641 transparent;
  }
  .delegations-heading, .delegation-head, .delegation-actions, .delegation-output-head {
    display: flex; align-items: center; gap: 8px;
  }
  .delegations-heading { justify-content: space-between; flex-wrap: wrap; font-size: 12px; color: var(--fg-dim); }
  #delegationsNotice { font-size: 12px; color: var(--fg-faint); }
  #delegationsNotice.error, #delegationOutput.error { color: var(--danger); }
  .delegation { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .delegation-name {
    flex: 1 1 auto; min-width: 0; padding: 0; border: 0; background: transparent;
    color: var(--fg); font-size: 13px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .delegation-name:hover { color: var(--accent); }
  .delegation-state { flex: 0 0 auto; font-size: 11px; color: var(--fg-dim); }
  .delegation-state.active { color: #9abaff; }
  .delegation-state.attention, .delegation-state.error { color: #ffb4b4; }
  .delegation-state.finished { color: var(--ok); }
  .delegation-description, .delegation-message, .delegation-delivery { font-size: 12px; color: var(--fg-dim); overflow-wrap: anywhere; }
  .delegation-description { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg-faint); }
  .delegation-message { white-space: pre-wrap; max-height: 4.95em; overflow-y: auto; }
  .delegation-delivery { white-space: pre-wrap; margin: 4px 0; }
  .delegation-actions { margin-top: 3px; justify-content: space-between; flex-wrap: wrap; }
  .delegation-time { font-size: 11px; color: var(--fg-faint); }
  #delegationsPanel button.small { flex: 0 0 auto; padding: 3px 8px; font-size: 12px; }
  #delegationsPanel button:disabled { opacity: .5; cursor: default; }
  #delegationDetail { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  #delegationDetailTitle { flex: 1 1 auto; min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
  #delegationOutput {
    margin: 7px 0 0; padding: 8px 10px; max-height: 180px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    color: var(--fg-dim); font: 12px/1.55 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #backgroundHint { color: var(--fg-dim); }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 7px; padding: 10px 12px; }
    header button { padding: 5px 8px; }
    header .meta { flex-basis: 100%; overflow-wrap: anywhere; }
    #delegationsToggle { margin-left: auto; }
    #delegationsPanel { margin-left: 10px; margin-right: 10px; }
    .delegation-output-head { flex-wrap: wrap; }
  }

  #list {
    flex: 1 1 auto; overflow-y: auto; padding: 18px 16px 8px;
    scroll-behavior: auto;              /* 不再整段平滑滚动，避免打开时“从头滑到尾” */
    scrollbar-width: thin;              /* Firefox */
    scrollbar-color: #2f3641 transparent;
  }
  /* 细而下沉的滚动条：thumb 用 border 制造内缩，视觉更轻 */
  #list::-webkit-scrollbar { width: 10px; height: 10px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb {
    background: #2f3641; border-radius: 999px;
    border: 3px solid var(--bg); background-clip: padding-box;
  }
  #list::-webkit-scrollbar-thumb:hover { background: #414a58; background-clip: padding-box; }
  #list::-webkit-scrollbar-corner { background: transparent; }

  /* 代码块 / 输入框的滚动条同样处理，统一观感 */
  .bubble pre::-webkit-scrollbar, textarea::-webkit-scrollbar { height: 8px; width: 8px; }
  .bubble pre::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track { background: transparent; }
  .bubble pre::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb {

<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="title">咕嘎一号</span>
  <button id="newChat" title="开一段新对话（清空当前上下文与页面记录）">新对话</button>
  <button id="delegationsToggle" aria-expanded="false" aria-controls="delegationsPanel" title="查看后台编码任务">后台任务 · 0</button>
  <span class="meta" id="meta"></span>
</header>

<section id="delegationsPanel" aria-label="后台编码任务" hidden>
  <div class="delegations-heading">
    <span>后台编码任务 · 不占用聊天</span>
    <span id="delegationsSummary">正在读取…</span>
  </div>
  <div id="delegationsNotice" role="status"></div>
  <div id="delegationsList"></div>
  <div id="delegationDetail" hidden>
    <div class="delegation-output-head">
      <span id="delegationDetailTitle"></span>
      <button id="refreshDelegationOutput" class="small">刷新输出</button>

</section>

<div id="list"></div>

<div id="composer">
  <div class="composer-inner">
    <div class="chips" id="chips"></div>
    <div class="composer-row">
      <textarea id="ta" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="mic" title="语音输入（点击开始/停止）">🎤</button>
      <button id="attach" title="上传文件">＋</button>
      <button id="send" class="primary">发送</button>
      <button id="stop" class="danger" hidden>停止</button>
    </div>
    <div class="hint" id="backgroundHint" role="status" hidden></div>
    <div class="hint" id="hint"></div>
  </div>
  <input type="file" id="file" multiple hidden>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = (p) => p + (TOKEN ? (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : '');
const api = (p, opt) => fetch(q(p), opt);

async function apiResult(path, options, expectedStatus) {
  const res = await api(path, options);
  let data;
  try { data = await res.json(); }
  catch { throw new Error(res.ok ? '服务端返回了无法解析的响应' : '服务端返回 HTTP ' + res.status); }
  if (!res.ok || !data || data.ok !== true || data.error) {
    throw new Error(data?.error?.message || data?.error || '服务端返回 HTTP ' + res.status + '，请求未成功');
  }
  if (expectedStatus !== undefined && res.status !== expectedStatus) {
    throw new Error('服务端返回 HTTP ' + res.status + '，应为 ' + expectedStatus + '；尚未确认接收，请勿盲目重试');
  }
  return data;
}

async function requireProjectDelivery(signal) {
  const res = await api('/api/status', { signal });
  let data;
  try { data = await res.json(); }
  catch { throw new Error('无法确认主服务自动交付版本，未重试交付'); }
  if (!res.ok || res.status !== 200 || !data || data.ok === false || data.projectDelivery !== true) {
    throw new Error('主服务未加载自动交付版本，未重试交付');
  }
}

const list = document.getElementById('list');
const ta = document.getElementById('ta');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const attachBtn = document.getElementById('attach');
const fileInput = document.getElementById('file');
const dot = document.getElementById('dot');
const metaEl = document.getElementById('meta');
const hintEl = document.getElementById('hint');
const chipsEl = document.getElementById('chips');
const newChatBtn = document.getElementById('newChat');

let pending = [];          // 待发送的上传文件（服务端路径）
let streaming = null;      // 当前 PA 回复，包含 requestId；后台通知不触碰它
let busy = false;          // 只表示当前 PA 正在处理，不锁聊天输入
let submitting = false;    // 只锁一次 /api/send 的 HTTP 提交
const renderedMessages = new Map();
const foregroundStreams = new Map();
const finishedRequests = new Set();
let sendFailureHint = '';

// ── 后台编码任务：独立于聊天 busy / 错误提示 / 语音状态 ──
const delegationsToggle = document.getElementById('delegationsToggle');
const delegationsPanel = document.getElementById('delegationsPanel');
const delegationsList = document.getElementById('delegationsList');
const delegationsSummary = document.getElementById('delegationsSummary');
const delegationsNotice = document.getElementById('delegationsNotice');
const backgroundHint = document.getElementById('backgroundHint');
const delegationDetail = document.getElementById('delegationDetail');
const delegationDetailTitle = document.getElementById('delegationDetailTitle');
const delegationOutput = document.getElementById('delegationOutput');
const refreshDelegationOutput = document.getElementById('refreshDelegationOutput');
const closeDelegationOutput = document.getElementById('closeDelegationOutput');
const activeDelegationStates = new Set(['queued', 'starting', 'running', 'needs_attention']);
const terminalDelegationStates = new Set(['completed', 'failed', 'timed_out', 'cancelled', 'closed']);
const delegationLabels = new Map([
  ['queued', '排队中'], ['starting', '启动中'], ['running', '运行中'],
  ['needs_attention', '需要关注'], ['completed', 'CA 执行结束'],
  ['failed', '执行失败'], ['timed_out', '已超时'], ['cancelled', '已取消'], ['closed', '资源已关闭'],
]);
const deliveryLabels = new Map([
  ['preparing', '准备交付环境中'], ['prepared', '交付环境已准备'],
  ['changes_ready', '变更已就绪，待验收/回写'], ['applying', '回写原项目中'],
  ['applied', '已回写，待原目标复验'], ['verified', '原目标复验通过，待清理'],
  ['cleaned', '原目标复验通过，已清理'], ['blocked', '交付受阻，需要处理'],
  ['rolled_back', '已回滚，未完成交付'], ['partial', '部分回写，未完成交付'], ['failed', '交付失败'],
]);
let delegationJobs = [];
let delegationsLoading = false;
let delegationsLoaded = false;
let delegationRevision = 0;
let delegationActionError = '';
let selectedDelegationId = null;
let outputController = null;
let outputVersion = 0;
const cancellingDelegations = new Set();
const integratingDelegations = new Set();

function delegationName(job) {
  return String(job.name || job.task || job.id || '未命名任务').split('\n')[0];
}
function delegationDelivery(job) {
  return job.delivery && typeof job.delivery === 'object' && !Array.isArray(job.delivery) ? job.delivery : null;
}
function canIntegrateDelegation(job) {
  const delivery = delegationDelivery(job);
  return job.status === 'completed' && !!job.notifiedAt && !!delivery && delivery.state !== 'cleaned';
}
function delegationNeedsAttention(job) {
  return job.deliveryHold === true || job.status === 'needs_attention' || canIntegrateDelegation(job)
    || ['blocked', 'rolled_back', 'partial', 'failed'].includes(delegationDelivery(job)?.state);
}
function delegationOutstanding(job) {
  return delegationNeedsAttention(job) || !terminalDelegationStates.has(job.status)
    || (job.status === 'completed' && !job.notifiedAt);
}
function delegationState(job) {
  const delivery = delegationDelivery(job);
  let label = delegationLabels.get(job.status) || '未知状态（' + String(job.status || '未提供') + '）';
  if (delegationNeedsAttention(job)) return { label: label + ' · 需处理' + (job.deliveryHold === true ? '（交付挂起）' : ''), tone: 'attention' };
  if (job.status === 'completed') {
    if (delivery?.state === 'cleaned') return { label: label + ' · 已交付', tone: 'finished' };
    if (delivery?.state === 'verified') return { label: label + ' · 原目标复验通过', tone: 'finished' };
    return { label: label + (job.notifiedAt ? ' · 交付未确认' : ' · 验收/交付中'), tone: job.notifiedAt ? '' : 'active' };
  }
  return { label, tone: activeDelegationStates.has(job.status) ? 'active' : ['failed', 'timed_out'].includes(job.status) ? 'error' : '' };
}
function delegationDeliveryText(job) {
  const delivery = delegationDelivery(job);
  const identity = delivery?.identity || job.projectIdentity || {};
  const lines = [
    '目标路径：' + (identity.targetCwd || job.cwd || identity.targetRoot || '未提供'),
    '目标分支：' + (identity.targetBranch || '未提供 / 非 Git'),
    '执行路径：' + (job.executionCwd || delivery?.executionCwd || '未提供'),
  ];
  if (delivery) {
    const mode = delivery.mode === 'git-worktree' ? 'Git 隔离工作树' : delivery.mode === 'in-place' ? '非 Git 备份后原地修改' : '模式未知';
    const updated = delivery.state === 'rolled_back' ? '已回滚，不能确认交付'
      : delivery.state === 'partial' ? '部分回写，需处理'
      : delivery.alreadyPresent === true ? '已包含本次变更'
      : delivery.targetUpdated === true ? '已回写' : '尚未确认回写/包含';
    const cleanup = delivery.mode === 'in-place'
      ? (delivery.cleanupDone === true ? '清理已完成' : '清理未完成') + '（原地模式，无临时树）'
      : '临时树' + (delivery.cleanupDone === true ? '已清理' : '未清理');
    lines.push('交付状态：' + (deliveryLabels.get(delivery.state) || '阶段未知，不能确认交付') + ' · ' + mode);
    lines.push('原项目：' + updated + ' · 变更文件：' + (Array.isArray(delivery.changes) ? delivery.changes.length : '未知') + ' · ' + cleanup);
    lines.push(['committed', 'pushed', 'deployed'].map((key, index) => {
      const label = ['提交', '推送', '部署'][index];
      return delivery[key] === false ? '未' + label : delivery[key] === true ? '已' + label + '（需核实授权）' : label + '未确认';
    }).join(' / '));
    if (delivery.error) lines.push('交付错误：' + String(delivery.error.message || delivery.error));
    if (Array.isArray(delivery.conflicts) && delivery.conflicts.length) lines.push('冲突项：' + delivery.conflicts.length + '；保留现场，不覆盖冲突');
  } else {
    lines.push('交付状态：旧任务无交付记录，不能确认原项目已更新');
    lines.push('清理未确认 / 提交未确认 / 推送未确认 / 部署未确认');
  }
  if (job.status === 'completed') lines.push('completed 仅表示 CA 执行结束；只有原目标复验通过才算已交付。');
  if (job.deliveryHold === true) lines.push('需处理：交付挂起；取消/关闭任务不会解除原项目占用。');
  return lines.join('\n');
}
function delegationTime(value) {
  if (value === undefined || value === null || value === '') return null;
  const time = new Date(value).getTime();
  return Number.isFinite(time) ? time : null;
}
function elapsedLabel(ms) {
  const seconds = Math.max(0, Math.floor(ms / 1000));
  if (seconds < 60) return seconds + '秒';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + '分' + (seconds % 60) + '秒';
  return Math.floor(minutes / 60) + '小时' + (minutes % 60) + '分';
}
function delegationClock(job) {
  const started = delegationTime(job.startedAt);
  const created = delegationTime(job.createdAt);
  const finished = delegationTime(job.finishedAt);
  const end = finished ?? (terminalDelegationStates.has(job.status) ? null : Date.now());
  const start = started ?? created;
  const duration = start !== null && end !== null ? elapsedLabel(end - start) : '未知';
  const deadline = delegationTime(job.deadlineAt);
  const deadlineLabel = deadline === null ? '未提供截止时间' : '截止 ' + new Date(deadline).toLocaleString('zh-CN', {
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
  return (started === null ? '等待时长 ' : '已运行 ') + duration + ' · ' + deadlineLabel;
}
function refreshDelegationClocks() {
  const jobs = new Map(delegationJobs.map((job) => [String(job.id), job]));
  for (const clock of delegationsList.querySelectorAll('[data-job-clock]')) {
    const job = jobs.get(clock.dataset.jobClock);
    if (job) clock.textContent = delegationClock(job);
  }
}
function renderDelegations() {
  const attention = delegationJobs.filter(delegationNeedsAttention);
  const active = delegationJobs.filter((job) => !delegationNeedsAttention(job)
    && (activeDelegationStates.has(job.status) || (job.status === 'completed' && !job.notifiedAt)));
  const unknown = delegationJobs.filter((job) => !delegationNeedsAttention(job)
    && !activeDelegationStates.has(job.status) && !terminalDelegationStates.has(job.status));
  const outstanding = active.length + attention.length + unknown.length;
  delegationsToggle.textContent = '后台任务 · ' + outstanding;
  delegationsToggle.title = '进行中 ' + active.length + '，需处理 ' + attention.length + '，状态待确认 ' + unknown.length + '；点击查看最近任务';
  delegationsSummary.textContent = '进行中 ' + active.length + ' · 需处理 ' + attention.length + ' · 共 ' + delegationJobs.length + ' 项' + (unknown.length ? ' · 状态待确认 ' + unknown.length : '');
  backgroundHint.hidden = outstanding === 0;
  backgroundHint.textContent = attention.length
    ? '后台任务或交付需要处理，你仍可以继续聊天'
    : active.length ? '编码任务或验收/交付在后台进行，你可以继续聊天' : '后台任务状态待确认，你可以继续聊天';

  // 交付挂起不因 cancelled/closed 隐藏；进行中及需处理任务始终可见。
  const focusId = document.activeElement?.dataset.jobId;
  const focusAction = document.activeElement?.dataset.action;
  const recent = [...delegationJobs].sort((a, b) => (delegationTime(b.createdAt) || 0) - (delegationTime(a.createdAt) || 0));
  const ongoing = recent.filter(delegationOutstanding);
  const visible = ongoing.concat(recent.filter((job) => !delegationOutstanding(job)).slice(0, Math.max(0, 12 - ongoing.length)));
  delegationsList.replaceChildren();
  for (const job of visible) {
    const id = String(job.id);
    const card = document.createElement('div');
    card.className = 'delegation';
    const head = document.createElement('div');
    head.className = 'delegation-head';
    const name = document.createElement('button');
    name.className = 'delegation-name';
    name.textContent = delegationName(job);
    name.title = '查看缓存输出 · ' + name.textContent;
    name.dataset.jobId = id;
    name.dataset.action = 'output';
    name.setAttribute('aria-expanded', String(selectedDelegationId === id));
    name.setAttribute('aria-controls', 'delegationDetail');
    name.onclick = () => loadDelegationOutput(id);
    const state = document.createElement('span');
    const presentation = delegationState(job);
    state.className = 'delegation-state' + (presentation.tone ? ' ' + presentation.tone : '');
    state.textContent = presentation.label;
    head.append(name, state);
    card.appendChild(head);
    if (job.task && job.task !== job.name) {
      const description = document.createElement('div');
      description.className = 'delegation-description';
      description.textContent = job.task;
      description.title = String(job.task);
      card.appendChild(description);
    }
    const deliveryInfo = document.createElement('div');
    deliveryInfo.className = 'delegation-delivery';
    deliveryInfo.textContent = delegationDeliveryText(job);
    card.appendChild(deliveryInfo);
    const message = document.createElement('div');
    message.className = 'delegation-message';
    message.textContent = job.message || (job.status === 'completed' ? 'CA 执行已结束，不代表原项目已更新；交付结论以原目标复验为准。' : '暂无更多说明');
    card.appendChild(message);
    const actions = document.createElement('div');
    actions.className = 'delegation-actions';
    const clock = document.createElement('span');
    clock.className = 'delegation-time';
    clock.dataset.jobClock = id;
    clock.textContent = delegationClock(job);
    actions.appendChild(clock);
    if (activeDelegationStates.has(job.status)) {
      const cancel = document.createElement('button');
      cancel.className = 'small danger';
      cancel.dataset.jobId = id;
      cancel.dataset.action = 'cancel';
      cancel.disabled = cancellingDelegations.has(id);
      cancel.textContent = cancel.disabled ? '取消中…' : '取消任务';
      cancel.title = '只取消此编码任务，不影响聊天';
      cancel.onclick = () => cancelDelegation(id);
      actions.appendChild(cancel);
    }
    if (canIntegrateDelegation(job)) {
      const integrate = document.createElement('button');
      integrate.className = 'small';
      integrate.dataset.jobId = id;
      integrate.dataset.action = 'integrate';
      integrate.disabled = integratingDelegations.has(id);
      integrate.textContent = integrate.disabled ? '提交交付重试中…' : '重试交付';
      integrate.title = '只重试后台交付，不重跑 CA、不强行覆盖冲突';
      integrate.onclick = () => integrateDelegation(id);
      actions.appendChild(integrate);
    }
    card.appendChild(actions);
    delegationsList.appendChild(card);
  }
  if (focusId && focusAction) {
    const target = [...delegationsList.querySelectorAll('button')].find((button) => button.dataset.jobId === focusId && button.dataset.action === focusAction);
    target?.focus({ preventScroll: true });
  }
}

async function loadDelegations() {
  refreshDelegationClocks();
  if (delegationsLoading || cancellingDelegations.size || integratingDelegations.size) return;
  if (navigator.onLine === false) {
    delegationsNotice.textContent = '网络已断开，暂保留上次任务状态；连接恢复后自动更新。';
    delegationsNotice.classList.add('error');
    return;
  }
  delegationsLoading = true;
  const revision = delegationRevision;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const data = await apiResult('/api/delegations', { signal: controller.signal });
    if (!Array.isArray(data.jobs)) throw new Error('任务列表格式无效');
    if (revision !== delegationRevision) return; // 不能让变更前的旧快照覆盖取消或重试交付结果。
    delegationJobs = data.jobs.filter((job) => job && job.id !== undefined && job.id !== null);
    delegationsLoaded = true;
    renderDelegations();
    delegationsNotice.textContent = delegationActionError || (delegationJobs.length ? '点击任务名称查看最近 80 行缓存输出。' : '暂无后台任务。');
    delegationsNotice.classList.toggle('error', !!delegationActionError);
  } catch (err) {
    delegationsNotice.textContent = '任务状态暂不可用' + (delegationsLoaded ? '，保留上次结果' : '') + '；将自动重试。';
    delegationsNotice.classList.add('error');
    if (!delegationsLoaded) delegationsSummary.textContent = '等待连接';
  } finally {
    clearTimeout(timeout);
    delegationsLoading = false;
  }
}

async function cancelDelegation(id) {
  if (cancellingDelegations.has(id)) return;
  const job = delegationJobs.find((item) => String(item.id) === id);
  if (!job || !activeDelegationStates.has(job.status)) return;
  if (!confirm('取消后台任务“' + delegationName(job) + '”吗？\n只会取消这个编码任务，不影响其它任务或当前聊天。')) return;
  cancellingDelegations.add(id);
  ++delegationRevision;
  delegationActionError = '';
  renderDelegations();
  try {
    const data = await apiResult('/api/delegations/' + encodeURIComponent(id) + '/cancel', { method: 'POST' });
    if (data.job && String(data.job.id) === id) delegationJobs = delegationJobs.map((item) => String(item.id) === id ? data.job : item);
    delegationsNotice.textContent = '已提交此任务的取消请求。';
    delegationsNotice.classList.remove('error');
  } catch (err) {
    delegationActionError = '取消失败：' + err.message;
    delegationsNotice.textContent = delegationActionError;
    delegationsNotice.classList.add('error');
  } finally {
    cancellingDelegations.delete(id);
    renderDelegations();
  }
}

async function integrateDelegation(id) {
  if (integratingDelegations.has(id)) return;
  const job = delegationJobs.find((item) => String(item.id) === id);
  if (!job || !canIntegrateDelegation(job)) return;
  if (!confirm('重试交付“' + delegationName(job) + '”吗？\n只重试原目标回写、复验和清理，不重跑 CA、不覆盖冲突，不提交、不推送、不部署，也不重启业务服务。')) return;
  integratingDelegations.add(id);
  ++delegationRevision;
  delegationActionError = '';
  renderDelegations();
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    await requireProjectDelivery(controller.signal);
    const data = await apiResult('/api/delegations/' + encodeURIComponent(id) + '/integrate', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ manual: true }), signal: controller.signal,
    }, 202);
    if (!data.job || String(data.job.id) !== id) throw new Error('主服务未返回匹配的任务，尚未确认接收，请勿盲目重试');
    delegationJobs = delegationJobs.map((item) => String(item.id) === id ? data.job : item);
    delegationsNotice.textContent = '后台已接收重试交付，不重跑 CA；接收不代表交付成功，结果将自动回传。';
    delegationsNotice.classList.remove('error');
  } catch (err) {
    delegationActionError = '重试交付未确认：' + (err.name === 'AbortError' ? '请求超时，请先查询任务状态，不要盲目重试' : err.message);
    delegationsNotice.textContent = delegationActionError;
    delegationsNotice.classList.add('error');
  } finally {
    clearTimeout(timeout);
    integratingDelegations.delete(id);
    renderDelegations();
  }
}

async function loadDelegationOutput(id) {
  selectedDelegationId = id;
  const version = ++outputVersion;
  if (outputController) outputController.abort();
  const controller = new AbortController();
  outputController = controller;
  const timeout = setTimeout(() => controller.abort(), 12000);
  const job = delegationJobs.find((item) => String(item.id) === id);
  delegationDetail.hidden = false;
  delegationDetailTitle.textContent = (job ? delegationName(job) : id) + ' · 缓存输出（最多 80 行）';
  delegationOutput.textContent = '正在读取缓存输出…';
  delegationOutput.classList.remove('error');
  refreshDelegationOutput.disabled = true;
  renderDelegations();
  delegationsPanel.scrollTop = delegationsPanel.scrollHeight;
  try {
    const data = await apiResult('/api/delegations/' + encodeURIComponent(id) + '/output?lines=80', { signal: controller.signal });
    if (version !== outputVersion) return;
    // 缓存输出可能包含 HTML / 终端内容，只作为纯文本显示。
    const followOutput = delegationsPanel.scrollHeight - delegationsPanel.scrollTop - delegationsPanel.clientHeight < 60;
    delegationOutput.textContent = String(data.output ?? '') || '暂无缓存输出。';
    if (followOutput) delegationsPanel.scrollTop = delegationsPanel.scrollHeight;
  } catch (err) {
    if (version !== outputVersion) return;
    delegationOutput.textContent = '读取失败：' + (err.name === 'AbortError' ? '请求超时，请重试' : err.message);
    delegationOutput.classList.add('error');
  } finally {
    clearTimeout(timeout);
    if (version === outputVersion) {
      outputController = null;
      refreshDelegationOutput.disabled = false;
    }
  }
}

delegationsToggle.onclick = () => {
  delegationsPanel.hidden = !delegationsPanel.hidden;
  delegationsToggle.setAttribute('aria-expanded', String(!delegationsPanel.hidden));
  if (!delegationsPanel.hidden) loadDelegations();
};
refreshDelegationOutput.onclick = () => {

};
closeDelegationOutput.onclick = () => {
  ++outputVersion;
  if (outputController) outputController.abort();
  outputController = null;
  selectedDelegationId = null;
  delegationDetail.hidden = true;
  renderDelegations();
};

// 贴底滚动：仅当用户本来就在底部附近时才自动跟到底，避免打断向上翻阅
let stickBottom = true;
const atBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 80;
function scrollToBottom() { list.scrollTop = list.scrollHeight; stickBottom = true; }
list.addEventListener('scroll', () => { stickBottom = atBottom(); });
// 图片异步加载会撑高内容，若仍在底部则跟着落到底
list.addEventListener('load', (e) => {
  if (e.target.tagName === 'IMG' && stickBottom) scrollToBottom();
}, true);

// ── 渲染 ──
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/** 极简格式化：只把 ``` 围栏块渲染成 <pre>，其余保持纯文本。 */
function renderText(text) {
  const out = [];
  const parts = String(text).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const body = part.replace(/^[a-zA-Z0-9_+-]*\n/, '');
      out.push('<pre>' + esc(body.replace(/\n$/, '')) + '</pre>');
    } else if (part) {
      out.push(esc(part));
    }
  });
  return out.join('');
}

function toolGroupEl() {
  const group = document.createElement('div');
  group.className = 'toolgroup';
  const head = document.createElement('div');
  head.className = 'toolgroup-h';
  head.innerHTML = '<span class="tg-arrow">▸</span><span class="tg-title">工具调用</span><span class="tg-last"></span>';
  const body = document.createElement('div');
  body.className = 'toolgroup-b';
  group.appendChild(head);
  group.appendChild(body);
  head.addEventListener('click', () => {
    group.classList.toggle('open');
    head.querySelector('.tg-arrow').textContent = group.classList.contains('open') ? '▾' : '▸';
  });
  return {
    group,
    body,
    setCount(n) { head.querySelector('.tg-title').textContent = '工具调用 · ' + n; },
    setLast(name) { head.querySelector('.tg-last').textContent = name ? '· ' + name : ''; },
  };
}

function toolEl(t) {
  const el = document.createElement('div');
  el.className = 'tool' + (t.isError ? ' err' : '');
  el.innerHTML = '<span class="nm">' + esc(t.name) + '</span><span class="dt">' + esc(t.detail || '') + '</span><span class="res"></span>';
  el.addEventListener('click', () => el.classList.toggle('open'));
  return el;
}

function renderMessage(m, beforeRow = null) {
  list.querySelector('.empty')?.remove();
  const id = m.id === undefined || m.id === null ? null : String(m.id);
  if (id !== null && renderedMessages.has(id)) return renderedMessages.get(id);
  const row = document.createElement('div');
  if (id !== null) row.dataset.messageId = id;
  row.className = 'row ' + (m.role === 'user' ? 'user' : 'assistant');

  if (m.via) {
    const via = document.createElement('div');
    via.className = 'via';
    via.textContent = '· ' + m.via + ' ·';
    row.appendChild(via);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderText(m.text || '');
  row.appendChild(bubble);

  const meta = m.meta || {};
  if (meta.images && meta.images.length) {
    for (const p of meta.images) {
      const img = document.createElement('img');
      img.src = q('/api/file?p=' + encodeURIComponent(p));
      img.loading = 'lazy';
      bubble.appendChild(img);
    }
  }
  if (meta.tools && meta.tools.length) {
    const box = document.createElement('div');
    box.className = 'tools';
    const g = toolGroupEl();
    for (const t of meta.tools) g.body.appendChild(toolEl(t));
    g.setCount(meta.tools.length);
    g.setLast((meta.tools[meta.tools.length - 1] || {}).name || '');
    box.appendChild(g.group);
    row.appendChild(box);
  }
  const foot = [];
  if (meta.durationMs) foot.push((meta.durationMs / 1000).toFixed(1) + 's');
  if (meta.tokens) foot.push(meta.tokens + ' tokens');
  if (meta.cost) foot.push('$' + meta.cost.toFixed(4));
  if (m.role === 'assistant' && m.via) foot.push(m.via);
  if (foot.length || meta.error) {
    const f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = esc(foot.join(' · ')) + (meta.error ? (foot.length ? ' · ' : '') + '<span class="err">' + esc(meta.error) + '</span>' : '');
    row.appendChild(f);
  }
  list.insertBefore(row, beforeRow?.parentNode === list ? beforeRow : null);
  if (id !== null) renderedMessages.set(id, row);
  if (stickBottom) scrollToBottom();
  return row;
}

function setBusy(v) {
  busy = v;
  dot.classList.toggle('busy', v);
  dot.title = v ? 'PA 正在处理当前消息，你可以继续发送，后续消息会排队' : '可以聊天';
  stopBtn.hidden = !v;
  stopBtn.title = '停止当前 PA 回复，不取消后台编码任务';
  updateSend();
}

function renderChips() {
  chipsEl.innerHTML = '';
  pending.forEach((p, i) => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = esc(p.name) + ' <button title="移除">×</button>';
    c.querySelector('button').onclick = () => { pending.splice(i, 1); renderChips(); updateSend(); };
    chipsEl.appendChild(c);
  });
}

// ── 事件流 ──
function findStream(requestId) {
  return requestId === undefined || requestId === null ? streaming : foregroundStreams.get(String(requestId));
}
function ensureStream(requestId) {
  const id = requestId === undefined || requestId === null ? '' : String(requestId);
  if (id && finishedRequests.has(id)) return null;
  let stream = foregroundStreams.get(id);
  if (!stream) {
    list.querySelector('.empty')?.remove();
    const row = document.createElement('div');
    row.className = 'row assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble cursor';
    const tools = document.createElement('div');
    tools.className = 'tools';
    tools.hidden = true;
    const g = toolGroupEl();
    tools.appendChild(g.group);
    row.append(bubble, tools);
    list.appendChild(row);
    stream = { row, bubble, tools, g, requestId: id, text: '', toolCount: 0 };
    foregroundStreams.set(id, stream);
  }
  streaming = stream;
  return stream;
}
function finishForeground(m, beforeRow = null) {
  const requestId = m.meta?.requestId;
  const stream = findStream(requestId);
  if (requestId !== undefined && requestId !== null) finishedRequests.add(String(requestId));
  const row = renderMessage(m, stream?.row || beforeRow);
  if (stream) {
    stream.row.remove();
    foregroundStreams.delete(stream.requestId);
    if (streaming === stream) streaming = null;
  }
  return row;
}

function connect() {
  const es = new EventSource(q('/api/events'));
  es.addEventListener('status', (e) => {
    const s = JSON.parse(e.data);
    metaEl.innerHTML = '<b>' + esc(s.model || '') + '</b>' + (s.workspace ? ' · ' + esc(s.workspace) : '');
    setBusy(!!s.busy);
    loadHistory(true);   // 初次连接和重连都补拉；消息按稳定 id 去重。
  });
  es.addEventListener('busy', (e) => setBusy(!!JSON.parse(e.data).busy));

  es.addEventListener('user', (e) => renderMessage(JSON.parse(e.data)));
  // 后台报告是一条独立消息，绝不能结束或清空当前 PA 的流式回复。
  es.addEventListener('notification', (e) => renderMessage(JSON.parse(e.data)));

  es.addEventListener('delta', (e) => {
    const d = JSON.parse(e.data);
    const stream = ensureStream(d.requestId);
    if (!stream) return;
    stream.text += d.text || '';
    stream.bubble.innerHTML = renderText(stream.text);
    if (stickBottom) scrollToBottom();
  });

  es.addEventListener('tool_start', (e) => {
    const d = JSON.parse(e.data);
    const stream = ensureStream(d.requestId);
    if (!stream) return;
    const el = toolEl({ name: d.name, detail: d.detail });
    el.dataset.id = String(d.id || '');
    stream.tools.hidden = false;
    stream.g.body.appendChild(el);
    stream.toolCount++;
    stream.g.setCount(stream.toolCount);
    stream.g.setLast(d.name);
    if (stickBottom) scrollToBottom();
  });
  es.addEventListener('tool_end', (e) => {
    const d = JSON.parse(e.data);
    const stream = findStream(d.requestId);
    if (!stream) return;
    const els = [...stream.tools.querySelectorAll('.tool')].reverse();
    const el = els.find((x) => x.dataset.id === String(d.id || '') && !x.dataset.done) || (!d.id ? els.find((x) => !x.dataset.done) : null);
    if (!el) return;
    el.dataset.done = '1';
    if (d.isError) el.classList.add('err');
    el.querySelector('.res').textContent = d.detail || '';
  });

  es.addEventListener('done', (e) => finishForeground(JSON.parse(e.data)));

  // 新对话：只重置聊天，后台编码任务及其面板不受影响。
  es.addEventListener('reset', () => {
    ++historyEpoch;   // 丢弃 reset 前尚未返回的历史请求。
    streaming = null;
    foregroundStreams.clear();
    finishedRequests.clear();
    renderedMessages.clear();
    list.replaceChildren();
    histLoaded = true;
    showEmpty();
    setBusy(false);
  });

  es.onerror = () => {
    // EventSource 自己会重连；这里只更新一处状态，不追加错误消息。
    metaEl.innerHTML = '<span style="color:#ff6b6b">连接断开，重连中…</span>';
  };
}

// ── 交互 ──
function updateSend() {
  sendBtn.disabled = submitting || (!ta.value.trim() && pending.length === 0);
  sendBtn.textContent = submitting ? '发送中…' : '发送';
}

ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
  updateSend();
});
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

attachBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const f of fileInput.files) {
    try {
      const res = await api('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const j = await res.json();
      if (j.ok) pending.push({ path: j.path, name: j.name });
      else hintEl.textContent = '上传失败：' + (j.error || f.name);
    } catch (err) {
      hintEl.textContent = '上传失败：' + err.message;
    }
  }
  fileInput.value = '';
  renderChips();
  updateSend();
};

async function send() {
  const draft = ta.value;
  const text = draft.trim();
  if (submitting || (!text && pending.length === 0)) return;
  const attachments = pending.slice();
  const uploads = attachments.map((p) => p.path);
  submitting = true; // 在任何 await 之前加锁，避免双击 / 连续 Enter 重复提交。
  pending = [];
  renderChips();
  ta.value = '';
  ta.style.height = 'auto';
  if (sendFailureHint && hintEl.textContent === sendFailureHint) hintEl.textContent = '';
  sendFailureHint = '';
  updateSend();
  try {
    // PA 忙碌时照常提交，排队由服务端负责；请求体保持原合同。
    await apiResult('/api/send', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, uploads }),
    });
  } catch (err) {
    // 恢复原草稿和附件，同时保留 HTTP 等待期间新输入 / 新上传的内容。
    const newerDraft = ta.value;
    ta.value = draft + (draft && newerDraft ? '\n' : '') + newerDraft;
    pending = attachments.concat(pending.filter((p) => !attachments.some((old) => old.path === p.path)));
    renderChips();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
    sendFailureHint = '发送失败：' + err.message + '。草稿和附件已恢复，请确认后重试。';
    hintEl.textContent = sendFailureHint;
  } finally {
    submitting = false;
    updateSend();
  }
}

sendBtn.onclick = send;
stopBtn.onclick = () => api('/api/abort', { method: 'POST' }).catch(() => {});

newChatBtn.onclick = async () => {
  if (submitting) { hintEl.textContent = '消息正在提交，请稍候再开新对话'; return; }
  if (busy) { hintEl.textContent = 'PA 正在处理当前消息，先点「停止」再开新对话（后台编码任务不受影响）'; return; }
  if (!confirm('开一段新对话？\n当前页面的记录会清空，模型的上下文也从头开始。\n（旧记录已归档到 memory/archive，不会真丢）')) return;
  try {
    const res = await api('/api/reset', { method: 'POST' });
    if (!res.ok) hintEl.textContent = '清空失败：服务端返回 ' + res.status + '（新接口没生效，可能要重启服务）';
  } catch (err) {
    hintEl.textContent = '清空失败：' + err.message;
  }
};

// ── 语音输入（浏览器原生 Web Speech API）──
const micBtn = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recing = false;

if (!SR) {
  micBtn.hidden = true;
} else {
  micBtn.onclick = () => (recing ? stopVoice() : startVoice());
}

function startVoice() {
  if (recing) return;
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.continuous = true;
  recog.interimResults = true;
  const baseText = ta.value;
  let finalText = '';
  recog.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    ta.value = baseText + finalText + interim;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
    updateSend();
  };
  recog.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      hintEl.textContent = '麦克风被拒绝：请在浏览器允许使用麦克风';
      stopVoice();
    } else if (e.error !== 'no-speech') {
      hintEl.textContent = '语音出错：' + e.error;
    }
  };
  recog.onend = () => {
    if (recing) { try { recog.start(); } catch (err) {} }
    else micBtn.classList.remove('rec');
  };
  recing = true;
  micBtn.classList.add('rec');
  hintEl.textContent = '正在听…（再点麦克风停止）';
  try { recog.start(); } catch (err) { recing = false; micBtn.classList.remove('rec'); }
}

function stopVoice() {
  recing = false;
  micBtn.classList.remove('rec');
  if (recog) { try { recog.stop(); } catch (err) {} }
  setTimeout(() => { if (!recing) hintEl.textContent = ''; }, 0);
}

// ── 启动 / 重连历史补拉 ──
let histLoaded = false;
let historyLoading = false;
let historyRequested = false;
let historyEpoch = 0;
function showEmpty() {
  if (list.children.length) return;
  const e = document.createElement('div');
  e.className = 'empty';
  e.innerHTML = '还没有对话。<br>试试 <kbd>今天几号？</kbd> 或 <kbd>看看 workspace 里有什么</kbd>';
  list.appendChild(e);
}
async function loadHistory(force = false) {
  if (histLoaded && !force) return;
  if (historyLoading) { historyRequested = historyRequested || force; return; }
  historyLoading = true;
  const epoch = historyEpoch;
  const initialRows = new Set(list.children);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const res = await api('/api/history?n=300', { signal: controller.signal });
    if (!res.ok) throw new Error('历史读取失败');
    const hist = await res.json();
    if (!Array.isArray(hist)) throw new Error('历史格式无效');
    if (epoch !== historyEpoch) return;
    if (hist.length) {
      list.querySelector('.empty')?.remove();
      // 补回的历史放到请求期间新到达的消息之前，已有 id 不重复渲染。
      const historyIds = new Set(hist.filter((m) => m.id !== undefined && m.id !== null).map((m) => String(m.id)));
      let nextRow = [...list.children].find((row) => !initialRows.has(row) && !historyIds.has(row.dataset.messageId)) || null;
      for (let i = hist.length - 1; i >= 0; i--) {
        const m = hist[i];
        const requestId = m.meta?.requestId;
        const oldStream = requestId === undefined || requestId === null ? null : foregroundStreams.get(String(requestId));
        // 重连时 PA 已空闲，历史里的完整回复可收束断线前残留的流式占位。
        nextRow = m.role === 'assistant' && oldStream && !busy
          ? finishForeground(m, nextRow) : renderMessage(m, nextRow);
      }
    } else if (!list.children.length) {
      showEmpty();
    }
    histLoaded = true;
    if (stickBottom) scrollToBottom();
  } catch {
    /* 不刷屏；EventSource 连接恢复后的 status 会再次补拉。 */
  } finally {
    clearTimeout(timeout);
    historyLoading = false;
    if (historyRequested) {
      historyRequested = false;
      loadHistory(true);
    }
  }
}

updateSend();
loadDelegations();
setInterval(loadDelegations, 5000); // 独立轮询，in-flight 锁及超时避免重叠 / 断线堆积。
connect();
loadHistory();
ta.focus();
</script>
</body>
</html>
